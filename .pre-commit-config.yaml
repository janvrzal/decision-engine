# Nástroje běží přes uv, aby měly stejné verze jako uv.lock a CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: hranice vrstev
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: pnpm -C frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-check
        name: frontend check
        entry: pnpm -C frontend check
        language: system
        files: ^frontend/
        pass_filenames: false
