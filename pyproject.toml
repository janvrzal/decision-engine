[project]
name = "decision-engine"
version = "0.1.0"
description = "Ze zadání k nářezovému plánu a ceně zakázky."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "ortools>=9.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=2",
    "langfuse>=5.2",
]

[project.scripts]
decision-engine = "decision_engine.api.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "httpx>=0.28.1",
]
# Spike #7 (router Jev); aplikace ani testy tuto skupinu nepotřebují.
router-spike = [
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # řazení importů
    "B",             # bugbear
    "UP",            # moderní syntaxe
    "SIM", "C4",     # zjednodušení
    "N",             # pojmenování
    "PT",            # pytest
    "RUF",
    "TID",           # zakázané API v jádře (TID251)
    "DTZ",           # datetime bez časové zóny
]
# Typografie v českých textech není záměna znaků.
allowed-confusables = ["–", "„", "“", "×", "’", "‚", "‘"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Jádro nesmí používat náhodu; předej seed nebo generátor jako argument (ADR-0001)."
"datetime.datetime.now".msg = "Jádro nesmí číst čas; předej ho jako argument (ADR-0001)."
"datetime.date.today".msg = "Jádro nesmí číst čas; předej ho jako argument (ADR-0001)."
"time.time".msg = "Jádro nesmí číst čas; předej ho jako argument (ADR-0001)."
"os.environ".msg = "Konfigurace se čte jen v adaptérech a API (ADR-0001)."
"os.getenv".msg = "Konfigurace se čte jen v adaptérech a API (ADR-0001)."

[tool.ruff.lint.per-file-ignores]
"src/decision_engine/adapters/**" = ["TID251"]
"src/decision_engine/api/**" = ["TID251"]
"tests/**" = ["TID251"]
"evals/**" = ["TID251"]
"scripts/**" = ["TID251"]

# --- Pyright ----------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "scripts"]
# Spike routeru potřebuje volitelnou skupinu `router-spike`; kontrola:
# uv run --group router-spike pyright scripts/spike_router.py
exclude = ["scripts/spike_router.py", "**/__pycache__", "**/.*"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Hranice vrstev (ADR-0001, ADR-0006) ------------------------------

[tool.importlinter]
root_package = "decision_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Jádro nezávisí na ostatních vrstvách ani na I/O knihovnách"
type = "forbidden"
source_modules = ["decision_engine.core"]
forbidden_modules = [
    "decision_engine.capabilities",
    "decision_engine.app",
    "decision_engine.adapters",
    "decision_engine.api",
    "fastapi",
    "openai",
    "langfuse",
]

[[tool.importlinter.contracts]]
name = "Registr schopností závisí jen na jádře"
type = "forbidden"
source_modules = ["decision_engine.capabilities"]
forbidden_modules = ["decision_engine.app", "decision_engine.adapters", "decision_engine.api"]

[[tool.importlinter.contracts]]
name = "Aplikační vrstva nezná adaptéry, HTTP ani poskytovatele AI"
type = "forbidden"
source_modules = ["decision_engine.app"]
forbidden_modules = ["decision_engine.adapters", "decision_engine.api", "fastapi", "openai", "langfuse"]

[[tool.importlinter.contracts]]
name = "Adaptéry nezávisí na API"
type = "forbidden"
source_modules = ["decision_engine.adapters"]
forbidden_modules = ["decision_engine.api", "fastapi"]

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not ai and not slow'"
markers = [
    "ai: volá placené AI API; spouští se jen na vyžádání (-m ai)",
    "slow: výkonnostní a dlouhé testy (-m slow)",
    "integration: testy adaptérů s reálným I/O mimo síť",
    "flow: testy toku přes reducer a app/ s falešnými adaptéry",
]

[tool.coverage.run]
source = ["decision_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
