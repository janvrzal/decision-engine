<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 272" role="img" aria-labelledby="plan-title plan-desc" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums"><title id="plan-title">Nářezový plán: jekl 40×40×2, 2 tyče po 6 000 mm, prořez 3 mm</title><desc id="plan-desc">1× tyč 6 000 mm (Tyč 1): sloupek 2 400, sloupek 2 400; řezy na 2 400, 4 803; zbytek 1 194 mm. 1× tyč 6 000 mm (Tyč 2): sloupek 2 400; řezy na 2 400; zbytek 3 597 mm.</desc><defs><pattern id="plan-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1efea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7d776c" stroke-width="1"/></pattern></defs><text x="16" y="20" font-size="14" font-weight="400" fill="#5c574e" text-anchor="start">2 tyče po 6 000 mm · prořez 3 mm · polohy řezů od začátku tyče</text><text x="16" y="94" font-size="15" font-weight="600" fill="#1d1b18" text-anchor="start">1×</text><text x="16" y="108" font-size="12" font-weight="400" fill="#5c574e" text-anchor="start">Tyč 1</text><rect x="88" y="80" width="856" height="30" rx="2" fill="#efede8" stroke="#8c8679"/><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="88" y="80" width="342.4" height="30" fill="#ffffff" stroke="#8c8679"/><rect x="88" y="80" width="342.4" height="8" fill="#a3d6c4"/><text x="259.2" y="102" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="430.83" y="80" width="342.4" height="30" fill="#ffffff" stroke="#8c8679"/><rect x="430.83" y="80" width="342.4" height="8" fill="#a3d6c4"/><text x="602.03" y="102" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g><title>řez na 2 400 mm od začátku tyče</title><line x1="430.4" y1="80" x2="430.4" y2="110" stroke="#a14f06" stroke-width="1.5"/><polygon points="426.4,73 434.4,73 430.4,79" fill="#a14f06"/><text x="430.4" y="70" font-size="12" font-weight="600" fill="#a14f06" text-anchor="middle">2 400</text></g><g><title>řez na 4 803 mm od začátku tyče</title><line x1="773.23" y1="80" x2="773.23" y2="110" stroke="#a14f06" stroke-width="1.5"/><polygon points="769.23,73 777.23,73 773.23,79" fill="#a14f06"/><text x="773.23" y="70" font-size="12" font-weight="600" fill="#a14f06" text-anchor="middle">4 803</text></g><g><title>využitelný zbytek 1 194 mm</title><rect x="773.66" y="80" width="170.34" height="30" fill="#dcefe1" stroke="#8c8679"/><text x="858.83" y="100" font-size="13" font-weight="600" fill="#0b6b5f" text-anchor="middle">zbytek 1 194</text></g><text x="16" y="164" font-size="15" font-weight="600" fill="#1d1b18" text-anchor="start">1×</text><text x="16" y="178" font-size="12" font-weight="400" fill="#5c574e" text-anchor="start">Tyč 2</text><rect x="88" y="150" width="856" height="30" rx="2" fill="#efede8" stroke="#8c8679"/><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="88" y="150" width="342.4" height="30" fill="#ffffff" stroke="#8c8679"/><rect x="88" y="150" width="342.4" height="8" fill="#a3d6c4"/><text x="259.2" y="172" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g><title>řez na 2 400 mm od začátku tyče</title><line x1="430.4" y1="150" x2="430.4" y2="180" stroke="#a14f06" stroke-width="1.5"/><polygon points="426.4,143 434.4,143 430.4,149" fill="#a14f06"/><text x="430.4" y="140" font-size="12" font-weight="600" fill="#a14f06" text-anchor="middle">2 400</text></g><g><title>využitelný zbytek 3 597 mm</title><rect x="430.83" y="150" width="513.17" height="30" fill="#dcefe1" stroke="#8c8679"/><text x="687.41" y="170" font-size="13" font-weight="600" fill="#0b6b5f" text-anchor="middle">zbytek 3 597</text></g><g transform="translate(16,204)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#9fc4e8"/></g><text x="34" y="215" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="start">nosník 6 500 mm (umístěno 0 z 1)</text><g transform="translate(316,204)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#a3d6c4"/></g><text x="334" y="215" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="start">sloupek 2 400 mm (3×)</text><g transform="translate(616,204)"><line x1="6" y1="0" x2="6" y2="12" stroke="#a14f06" stroke-width="1.5"/></g><text x="634" y="215" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="start">řez, číslo = poloha od začátku tyče</text><g transform="translate(16,230)"><rect width="12" height="12" fill="#dcefe1" stroke="#8c8679"/></g><text x="34" y="241" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="start">využitelný zbytek od 300 mm</text><g transform="translate(316,230)"><rect width="12" height="12" fill="url(#plan-hatch)" stroke="#8c8679"/></g><text x="334" y="241" font-size="13" font-weight="400" fill="#1d1b18" text-anchor="start">odpad</text></svg>
