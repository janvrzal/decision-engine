<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 244" role="img" aria-labelledby="plan-title plan-desc" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums"><title id="plan-title">Nářezový plán: jekl 40×40×2, 2 tyče po 6 000 mm, prořez 3 mm</title><desc id="plan-desc">1× tyč 6 000 mm (Tyč 1): sloupek 2 400, sloupek 2 400; řezy na 2 400, 4 803; zbytek 1 194 mm. 1× tyč 6 000 mm (Tyč 2): sloupek 2 400; řezy na 2 400; zbytek 3 597 mm.</desc><defs><pattern id="plan-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1efea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7d776c" stroke-width="1"/></pattern></defs><text x="16" y="20" font-size="13" font-weight="400" fill="#5c574e" text-anchor="start">2 tyče po 6 000 mm · prořez 3 mm · polohy řezů od začátku tyče</text><text x="16" y="87" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="start">1×</text><text x="16" y="99" font-size="11" font-weight="400" fill="#5c574e" text-anchor="start">Tyč 1</text><rect x="88" y="74" width="856" height="26" rx="2" fill="#efede8" stroke="#8c8679"/><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="88" y="74" width="342.4" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="88" y="74" width="342.4" height="5" fill="#a3d6c4"/><text x="259.2" y="93" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="430.83" y="74" width="342.4" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="430.83" y="74" width="342.4" height="5" fill="#a3d6c4"/><text x="602.03" y="93" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g><title>řez na 2 400 mm od začátku tyče</title><line x1="430.4" y1="74" x2="430.4" y2="100" stroke="#a14f06" stroke-width="1.5"/><polygon points="426.4,67 434.4,67 430.4,73" fill="#a14f06"/><text x="430.4" y="65" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">2 400</text></g><g><title>řez na 4 803 mm od začátku tyče</title><line x1="773.23" y1="74" x2="773.23" y2="100" stroke="#a14f06" stroke-width="1.5"/><polygon points="769.23,67 777.23,67 773.23,73" fill="#a14f06"/><text x="773.23" y="65" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">4 803</text></g><g><title>využitelný zbytek 1 194 mm</title><rect x="773.66" y="74" width="170.34" height="26" fill="#dcefe1" stroke="#8c8679"/><text x="858.83" y="91" font-size="11" font-weight="600" fill="#0b6b5f" text-anchor="middle">zbytek 1 194</text></g><text x="16" y="147" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="start">1×</text><text x="16" y="159" font-size="11" font-weight="400" fill="#5c574e" text-anchor="start">Tyč 2</text><rect x="88" y="134" width="856" height="26" rx="2" fill="#efede8" stroke="#8c8679"/><g data-part-id="p2"><title>sloupek 2 400 mm</title><rect x="88" y="134" width="342.4" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="88" y="134" width="342.4" height="5" fill="#a3d6c4"/><text x="259.2" y="153" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">sloupek 2 400</text></g><g><title>řez na 2 400 mm od začátku tyče</title><line x1="430.4" y1="134" x2="430.4" y2="160" stroke="#a14f06" stroke-width="1.5"/><polygon points="426.4,127 434.4,127 430.4,133" fill="#a14f06"/><text x="430.4" y="125" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">2 400</text></g><g><title>využitelný zbytek 3 597 mm</title><rect x="430.83" y="134" width="513.17" height="26" fill="#dcefe1" stroke="#8c8679"/><text x="687.41" y="151" font-size="11" font-weight="600" fill="#0b6b5f" text-anchor="middle">zbytek 3 597</text></g><g transform="translate(16,184)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#9fc4e8"/></g><text x="34" y="194" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">nosník 6 500 mm (umístěno 0 z 1)</text><g transform="translate(240,184)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#a3d6c4"/></g><text x="258" y="194" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">sloupek 2 400 mm (3×)</text><g transform="translate(464,184)"><line x1="6" y1="0" x2="6" y2="12" stroke="#a14f06" stroke-width="1.5"/></g><text x="482" y="194" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">řez, číslo = poloha od začátku tyče</text><g transform="translate(688,184)"><rect width="12" height="12" fill="#dcefe1" stroke="#8c8679"/></g><text x="706" y="194" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">využitelný zbytek od 300 mm</text><g transform="translate(16,206)"><rect width="12" height="12" fill="url(#plan-hatch)" stroke="#8c8679"/></g><text x="34" y="216" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">odpad</text></svg>
