<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="plan-title plan-desc" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" style="font-variant-numeric: tabular-nums"><title id="plan-title">Nářezový plán: 5 tyčí po 6 000 mm, prořez 3 mm</title><desc id="plan-desc">5× tyč 6 000 mm (Tyč 1–5): jekl 2 000, jekl 2 000, příčka 1 500; řezy na 2 000, 4 003, 5 506; zbytek 491 mm.</desc><defs><pattern id="plan-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1efea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#7d776c" stroke-width="1"/></pattern></defs><text x="16" y="20" font-size="13" font-weight="400" fill="#5c574e" text-anchor="start">5 tyčí po 6 000 mm · prořez 3 mm · polohy řezů od začátku tyče</text><text x="16" y="87" font-size="14" font-weight="600" fill="#1d1b18" text-anchor="start">5×</text><text x="16" y="99" font-size="11" font-weight="400" fill="#5c574e" text-anchor="start">Tyč 1–5</text><rect x="88" y="74" width="856" height="26" rx="2" fill="#efede8" stroke="#8c8679"/><g data-part-id="p1"><title>jekl 2 000 mm</title><rect x="88" y="74" width="285.33" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="88" y="74" width="285.33" height="5" fill="#9fc4e8"/><text x="230.67" y="93" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">jekl 2 000</text></g><g data-part-id="p1"><title>jekl 2 000 mm</title><rect x="373.76" y="74" width="285.33" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="373.76" y="74" width="285.33" height="5" fill="#9fc4e8"/><text x="516.43" y="93" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">jekl 2 000</text></g><g data-part-id="p2"><title>příčka 1 500 mm</title><rect x="659.52" y="74" width="214" height="26" fill="#ffffff" stroke="#8c8679"/><rect x="659.52" y="74" width="214" height="5" fill="#a3d6c4"/><text x="766.52" y="93" font-size="11" font-weight="400" fill="#1d1b18" text-anchor="middle">příčka 1 500</text></g><g><title>řez na 2 000 mm od začátku tyče</title><line x1="373.33" y1="74" x2="373.33" y2="100" stroke="#a14f06" stroke-width="1.5"/><polygon points="369.33,67 377.33,67 373.33,73" fill="#a14f06"/><text x="373.33" y="65" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">2 000</text></g><g><title>řez na 4 003 mm od začátku tyče</title><line x1="659.09" y1="74" x2="659.09" y2="100" stroke="#a14f06" stroke-width="1.5"/><polygon points="655.09,67 663.09,67 659.09,73" fill="#a14f06"/><text x="659.09" y="65" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">4 003</text></g><g><title>řez na 5 506 mm od začátku tyče</title><line x1="873.52" y1="74" x2="873.52" y2="100" stroke="#a14f06" stroke-width="1.5"/><polygon points="869.52,67 877.52,67 873.52,73" fill="#a14f06"/><text x="873.52" y="65" font-size="11" font-weight="600" fill="#a14f06" text-anchor="middle">5 506</text></g><g><title>využitelný zbytek 491 mm</title><rect x="873.95" y="74" width="70.05" height="26" fill="#dcefe1" stroke="#8c8679"/></g><g transform="translate(16,124)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#9fc4e8"/></g><text x="34" y="134" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">jekl 2 000 mm (10×)</text><g transform="translate(240,124)"><rect width="12" height="12" fill="#ffffff" stroke="#8c8679"/><rect width="12" height="4" fill="#a3d6c4"/></g><text x="258" y="134" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">příčka 1 500 mm (5×)</text><g transform="translate(464,124)"><line x1="6" y1="0" x2="6" y2="12" stroke="#a14f06" stroke-width="1.5"/></g><text x="482" y="134" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">řez, číslo = poloha od začátku tyče</text><g transform="translate(688,124)"><rect width="12" height="12" fill="#dcefe1" stroke="#8c8679"/></g><text x="706" y="134" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">využitelný zbytek od 300 mm</text><g transform="translate(16,146)"><rect width="12" height="12" fill="url(#plan-hatch)" stroke="#8c8679"/></g><text x="34" y="156" font-size="12" font-weight="400" fill="#1d1b18" text-anchor="start">odpad</text></svg>
