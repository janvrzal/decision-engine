name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Formát
        run: uv run ruff format --check
      - name: Typy
        run: uv run pyright
      - name: Hranice vrstev
        run: uv run lint-imports
      - name: Testy
        run: uv run pytest --cov --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typy API odpovídají backendu
        run: pnpm generate:api && git diff --exit-code -- src/lib/api
      - name: Typy a Svelte
        run: pnpm check
      - name: Lint a formát
        run: pnpm lint
      - name: Prohlížeč pro testy
        run: pnpm exec playwright install --with-deps chromium
      - name: Testy
        run: pnpm test
      - name: End-to-end testy
        run: pnpm test:e2e
